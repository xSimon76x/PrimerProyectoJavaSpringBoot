<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Java Spring Boot Web</title>

    <script>
        let datos = "${datos}"
        console.log(datos)
    </script>
</head>
<body>
    <div>
        <h1 th:text="${users}"></h1>
        <p th:text="${datos}">Hola Mundo Spring Boot</p>
        <p>${name}</p>
        <ul>
            <li th:text="${name}"></li>
            <li th:text="${lastname}"></li>
            <li th:text="${user.lastname}"></li>
            <li th:if="${user.email != null}" th:text="${user.email}"></li>
            <li th:if="${ not (user.email != null)}" th:text="${'no tiene email'}"></li>
        </ul>
    </div>
    <a th:href="@{/list}">hacia list</a>
    <br>
    <a th:href="@{'/api/params/foo?paramMensaje=' + ${title}}">ver listado de foo</a>
    <br>
    <a th:href="@{/api/params/foo(paramMensaje='hola')}">ver listado de foo 2</a>
    <br>
    <a th:href="@{/api/params/bar(text='hola', code=223)}">ver bar</a>
    <br>
    <a th:href="@{/api/var/baz/hola algun mensaje}">ver bar vaz con path variable</a>
    <br>
    <a th:href="@{'/api/var/baz/' + ${title}}">ver bar vaz con path variable 2</a>
</body>
</html>
